# Upgrade Check — daily PRs refreshing the Flutter SDK pin (.fvmrc) and the
# lockfiles to latest in-range (shared reusable workflow), plus this repo's ONE
# local pin: pana (tool/versions.env), tracked to pub.dev's latest so the
# platform gate keeps running the same pana pub.dev runs. The shared tool/binary
# pins (fvm, Chrome, bore, ...) are NOT here — whuppi/ci owns those, and they
# arrive via a whuppi/ci release + a grouped Dependabot bump.
name: Upgrade Check

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch:

permissions: {}

# Daily radar — never cancel an in-flight run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Flutter SDK (.fvmrc + example/.fvmrc) + lockfiles, each its own PR.
  shared:
    permissions:
      contents: write       # pushes the chore/flutter-sdk + chore/lockfiles branches
      pull-requests: write  # opens / edits the upgrade PRs
    uses: whuppi/ci/.github/workflows/upgrade-check.yml@v2.4.0
    with:
      branch: dev

  # This repo's OWN pinned pana (tool/versions.env), tracked to pub.dev's latest
  # by tool/ci/upgrade.sh. Its own PR so the bump is reviewed alone. No
  # verify-pinned step — pana resolves from pub.dev, there's no sha to re-hash.
  pins:
    name: Pinned versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # pushes the chore/pins branch
      issues: write         # gh label create fallback (labels.yml is canonical)
      pull-requests: write  # opens / edits the pins PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dev
          persist-credentials: false

      - name: Prepare pins branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # persist-credentials:false leaves the remote unauthenticated — wire
          # gh's token into git so the branch push below works.
          gh auth setup-git
          gh label create upgrade-pins --description "Auto: pinned version bump (review the change)" --color "1d76db" 2>/dev/null || true
          EXISTING_PR=$(gh pr list --label upgrade-pins --state open --json number --jq '.[0].number // empty')
          echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING_PR" ]; then
            git fetch origin chore/pins 2>/dev/null || true
            git checkout -B chore/pins origin/chore/pins 2>/dev/null || git checkout -b chore/pins
          else
            git checkout -b chore/pins
          fi

      - name: Bump pinned versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/upgrade.sh apply

      - name: Commit + open or update the pins PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_PR: ${{ steps.branch.outputs.existing_pr }}
        run: |
          git add tool/versions.env
          git commit -m "chore: bump pinned versions" || {
            echo "Pins already fresh — nothing to bump."
            exit 0
          }
          if [ -n "$EXISTING_PR" ]; then
            git push origin chore/pins
          else
            # Any remote copy is debris from a closed PR. Plain --force, not
            # --force-with-lease: only the bot pushes this branch, and lease
            # fails when there's no remote-tracking ref (fresh or post-merge).
            git push --force origin chore/pins
          fi

          PR_BODY="$(cat <<'EOF'
          Tracks pub.dev's latest pana so the platform gate keeps running the
          same analyzer pub.dev runs.

          - **`PANA_VERSION` in `tool/versions.env`** — bumped to pub.dev's
            latest; the `platforms` gate pins to it. See the diff for the move.

          Merge once green.

          _Auto-generated by upgrade-check.yml_
          EOF
          )"

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base dev \
              --head chore/pins \
              --title "chore: bump pinned versions" \
              --label upgrade-pins \
              --draft \
              --body "$PR_BODY"
          else
            gh pr edit "$EXISTING_PR" \
              --title "chore: bump pinned versions" \
              --body "$PR_BODY"
          fi
