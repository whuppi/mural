# PR Checks — conventional-commit title, promotion chain, changelog-version
# sanity (both lanes), and workflow + shell lint. Delegates to the shared
# reusable workflow.
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:

permissions: {}

# One in-flight run per PR; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read  # the reusable jobs only checkout + lint, read-only
    uses: whuppi/ci/.github/workflows/pr-checks.yml@v2.4.0
